<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#c78fa4" />
  <title>Books for my Panther ♡</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Panther Books">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    :root {
      --bg:#d9a9ba; --bg2:#c78fa4; --accent:#9f5f78;
      --text:#34282d; --muted:#776970; --line:rgba(50,35,42,.12);
      --glass:rgba(255,255,255,.74); --shadow:0 28px 70px rgba(67,43,54,.24);
      --top:98px;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    html,body { width:100%; height:100%; overflow:hidden; }
    body {
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 13% 18%, color-mix(in srgb,var(--bg2) 80%,black 20%), transparent 35%),
        radial-gradient(circle at 86% 78%, color-mix(in srgb,var(--bg) 82%,black 18%), transparent 38%),
        linear-gradient(135deg,var(--bg),var(--bg2));
      transition:background .45s ease,color .3s ease;
      -webkit-tap-highlight-color:transparent;
    }
    button { font:inherit; color:inherit; }

    .passcode-gate {
      position: fixed;
      inset: 0;
      z-index: 500;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,.18), transparent 30%),
        radial-gradient(circle at 80% 75%, rgba(255,255,255,.10), transparent 32%),
        linear-gradient(135deg,var(--bg),var(--bg2));
      transition: opacity .35s ease, visibility .35s ease;
    }

    .passcode-gate.unlocked {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .passcode-card {
      width: min(360px, 92vw);
      text-align: center;
      padding: 28px 22px 24px;
      border-radius: 28px;
      background: rgba(255,255,255,.76);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(60,45,50,.10);
      box-shadow: 0 28px 70px rgba(67,43,54,.18);
    }

    .passcode-card.shake {
      animation: passcodeShake .34s ease;
    }

    @keyframes passcodeShake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-9px); }
      50% { transform: translateX(9px); }
      75% { transform: translateX(-5px); }
    }

    .passcode-kicker {
      font-size: .72rem;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 9px;
    }

    .passcode-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 9vw, 3rem);
      line-height: 1;
      margin-bottom: 10px;
    }

    .passcode-subtitle {
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.55;
      margin-bottom: 24px;
    }

    .passcode-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    .passcode-dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      border: 1.5px solid rgba(60,45,50,.25);
      background: rgba(255,255,255,.32);
      transition: .16s ease;
    }

    .passcode-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
      transform: scale(1.08);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 10px;
    }

    .key {
      min-height: 58px;
      border-radius: 18px;
      border: 1px solid rgba(60,45,50,.09);
      background: rgba(255,255,255,.68);
      cursor: pointer;
      font-size: 1.12rem;
      box-shadow: 0 8px 20px rgba(60,45,50,.06);
      transition: transform .12s ease, background .12s ease;
    }

    .key:hover {
      background: rgba(255,255,255,.92);
    }

    .key:active {
      transform: scale(.96);
    }

    .key.utility {
      font-size: .82rem;
      color: var(--muted);
    }

    .passcode-error {
      min-height: 22px;
      margin-top: 14px;
      color: #8f4f5d;
      font-size: .82rem;
    }

    .topbar {
      position:fixed; z-index:40; inset:0 0 auto 0;
      padding:max(16px,env(safe-area-inset-top)) max(18px,env(safe-area-inset-right)) 10px max(18px,env(safe-area-inset-left));
      background:linear-gradient(to bottom,rgba(255,255,255,.20),transparent);
      backdrop-filter:blur(3px);
    }
    .toprow { display:flex; align-items:center; justify-content:space-between; gap:14px; }
    .brand { font-family:Georgia,"Times New Roman",serif; font-size:1.2rem; font-weight:700; letter-spacing:.02em; white-space:nowrap; }
    .top-actions { display:flex; align-items:center; gap:9px; }
    .pill {
      border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.72);
      backdrop-filter:blur(14px); padding:9px 13px; cursor:pointer; box-shadow:0 10px 24px rgba(65,45,53,.10);
    }
    .saved-tab span { display:inline-grid; place-items:center; min-width:21px; height:21px; margin-left:4px; padding:0 5px; border-radius:999px; background:rgba(0,0,0,.07); font-size:.72rem; }
    .filters {
      display:flex; gap:8px; margin-top:11px; overflow-x:auto; scrollbar-width:none; padding-bottom:3px;
      overscroll-behavior-inline:contain;
    }
    .filters::-webkit-scrollbar { display:none; }
    .filter { flex:0 0 auto; border:1px solid var(--line); background:rgba(255,255,255,.50); border-radius:999px; padding:7px 11px; font-size:.77rem; cursor:pointer; }
    .filter.active { background:rgba(255,255,255,.90); box-shadow:0 7px 18px rgba(55,38,45,.10); }

    .bookshelf {
      width:100vw; height:100dvh; display:flex; align-items:center; gap:clamp(34px,6vw,86px);
      overflow-x:auto; overflow-y:hidden; padding:calc(var(--top) + 42px) 10vw max(44px,env(safe-area-inset-bottom));
      scroll-snap-type:x mandatory; scroll-padding-inline:10vw; scroll-behavior:smooth;
      scrollbar-width:none; perspective:1400px; overscroll-behavior-x:contain; -webkit-overflow-scrolling:touch;
    }
    .bookshelf::-webkit-scrollbar { display:none; }
    .book {
      flex:0 0 auto; position:relative; width:clamp(180px,22vw,278px); aspect-ratio:2/3;
      scroll-snap-align:center; cursor:pointer; transform-style:preserve-3d; outline:none;
      transition:transform .34s cubic-bezier(.2,.85,.2,1),filter .25s ease,opacity .25s ease;
    }
    .book::before {
      content:""; position:absolute; inset:9px -14px 9px 12px; border-radius:5px 12px 12px 5px;
      background:linear-gradient(90deg,#cfc4b9 0 5%,#f3ede7 6% 93%,#bfb2a7 94% 100%);
      transform:translateZ(-18px); box-shadow:var(--shadow);
    }
    .book::after {
      content:""; position:absolute; left:7px; top:0; width:17px; height:100%; border-radius:3px;
      background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(255,255,255,.14));
      transform-origin:left center; transform:rotateY(90deg) translateZ(1px);
    }
    .book-cover {
      position:absolute;
      inset:0;
      overflow:hidden;
      border-radius:4px 9px 9px 4px;
      transform:translateZ(12px);
      box-shadow:0 25px 48px rgba(54,35,43,.30);
      background:transparent;
    }
    .generated-cover {
      position:absolute; inset:0;
      transition:opacity .25s ease, visibility .25s ease;
      background:
        radial-gradient(circle at 70% 18%,rgba(255,255,255,.16),transparent 24%),
        linear-gradient(155deg,var(--cover1),var(--cover2));
    }
    .generated-cover::after {
      content:"";
      position:absolute; inset:0;
      background:linear-gradient(115deg,rgba(255,255,255,.08),transparent 30%,rgba(0,0,0,.10));
    }
    .fallback-cover-inner {
      position:absolute;
      inset:0;
      z-index:1;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding:22px 17px;
      color:white;
      text-shadow:0 2px 16px rgba(0,0,0,.28);
      transition:opacity .3s ease;
    }
    .fallback-mark { font-size:1.25rem; opacity:.82; }
    .fallback-title {
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(1.1rem,2vw,1.55rem);
      line-height:1.03;
      margin-bottom:8px;
    }
    .fallback-author {
      font-size:.68rem;
      text-transform:uppercase;
      letter-spacing:.09em;
      opacity:.86;
    }
    .real-cover {
      position:absolute;
      top:50%;
      left:50%;
      width:112%;
      height:112%;
      object-fit:cover;
      object-position:center;
      display:block;
      opacity:0;
      transition:opacity .28s ease;
      image-rendering:auto;
      backface-visibility:hidden;
      transform:translate(-50%,-50%) translateZ(0);
      border:0;
      outline:0;
      box-shadow:none;
    }
    .real-cover.loaded { opacity:1; }
    .book:hover,.book:focus-visible { transform:translateY(-24px) rotateY(-15deg) rotateX(5deg) scale(1.07); z-index:8; }

    .empty-state { width:100%; display:grid; place-items:center; text-align:center; color:var(--muted); padding:40px; }



    .modal,.saved-panel { position:fixed; inset:0; z-index:100; display:none; background:rgba(45,30,37,.25); backdrop-filter:blur(16px); }
    .modal.open,.saved-panel.open { display:flex; }
    .modal { align-items:center; justify-content:center; padding:22px; }
    .detail-card {
      position:relative; width:min(960px,96vw); max-height:91dvh; overflow:auto; display:grid; grid-template-columns:minmax(210px,320px) 1fr;
      gap:clamp(28px,5vw,58px); align-items:center; padding:clamp(28px,5vw,52px); border:1px solid var(--line); border-radius:28px;
      background:rgba(255,255,255,.86); backdrop-filter:blur(22px); box-shadow:0 40px 95px rgba(52,34,42,.28); animation:rise .28s ease;
    }
    @keyframes rise { from{opacity:0;transform:translateY(18px) scale(.98)} to{opacity:1;transform:none} }
    .close { position:absolute; top:16px; right:16px; width:40px; height:40px; border-radius:50%; border:1px solid var(--line); background:rgba(255,255,255,.78); cursor:pointer; z-index:6; font-size:1.15rem; }
    .detail-book { position:relative; width:100%; aspect-ratio:2/3; transform:perspective(1200px) rotateY(-10deg); transform-style:preserve-3d; }
    .detail-book::before { content:""; position:absolute; inset:8px -16px 8px 10px; border-radius:4px 12px 12px 4px; background:linear-gradient(90deg,#d4c6b9,#f3ece5 9% 93%,#c5b6a9); transform:translateZ(-20px); box-shadow:25px 28px 52px rgba(55,36,44,.23); }
    .detail-cover {
      position:absolute;
      inset:0;
      overflow:hidden;
      border-radius:4px 9px 9px 4px;
      transform:translateZ(12px);
      box-shadow:0 28px 54px rgba(55,36,44,.25);
      background:transparent;
      border:0;
      outline:0;
    }
    .detail-cover img {
      position:absolute;
      top:50%;
      left:50%;
      width:112%;
      height:112%;
      object-fit:cover;
      object-position:center;
      opacity:0;
      transition:opacity .28s ease;
      transform:translate(-50%,-50%);
      border:0;
      outline:0;
      box-shadow:none;
    }
    .detail-cover img.loaded { opacity:1; }
    .detail-cover .generated-cover { padding:28px 22px; }
    .details h1 {
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(2rem,4.8vw,4rem);
      line-height:1.03;
      margin:0 0 20px;
    }
    .details p {
      line-height:1.78;
      color:#5c4d53;
      font-size:1rem;
      max-width:58ch;
    }
    .actions { display:flex; gap:10px; margin-top:24px; flex-wrap:wrap; }
    .save-btn,.warning-btn,.read-free-btn {
      border:1px solid var(--line);
      border-radius:999px;
      padding:11px 16px;
      cursor:pointer;
      background:rgba(255,255,255,.75);
      text-decoration:none;
      display:inline-flex;
      align-items:center;
      justify-content:center;
    }
    .read-free-btn {
      background:color-mix(in srgb,var(--accent) 22%,white 78%);
      font-weight:650;
    }
    .save-btn.saved { background:color-mix(in srgb,var(--accent) 28%,white 72%); }
    .warnings { display:none; margin-top:12px; padding:13px 15px; border-radius:16px; background:rgba(93,48,61,.08); line-height:1.55; color:#654f57; font-size:.86rem; }
    .warnings.open { display:block; }

    .saved-panel { align-items:center; justify-content:center; padding:22px; }
    .saved-shell { position:relative; width:min(1100px,96vw); height:min(80dvh,740px); border-radius:28px; background:rgba(255,255,255,.86); border:1px solid var(--line); box-shadow:0 38px 90px rgba(55,36,44,.24); padding:26px; overflow:hidden; }
    .saved-header { display:flex; align-items:center; justify-content:space-between; gap:15px; margin-bottom:16px; }
    .saved-header h2 { font-family:Georgia,"Times New Roman",serif; font-size:clamp(1.8rem,4vw,2.7rem); }
    .saved-books { height:calc(100% - 68px); overflow-x:auto; overflow-y:hidden; display:flex; align-items:center; gap:34px; padding:8px 8px 28px; scrollbar-width:none; scroll-snap-type:x mandatory; }
    .saved-books::-webkit-scrollbar { display:none; }
    .saved-book { flex:0 0 auto; width:clamp(150px,19vw,220px); aspect-ratio:2/3; position:relative; cursor:pointer; scroll-snap-align:center; transform-style:preserve-3d; transition:.25s; }
    .saved-book:hover { transform:translateY(-12px) rotateY(-10deg) scale(1.04); }
    .saved-book::before { content:""; position:absolute; inset:8px -12px 8px 10px; background:linear-gradient(90deg,#d7cbc0 0 5%,#f2ebe5 6% 93%,#c9bbb0 94% 100%); border-radius:4px 10px 10px 4px; transform:translateZ(-16px); box-shadow:0 22px 42px rgba(65,45,50,.20); }
    .saved-book .book-cover { transform:translateZ(10px); }

    .theme-wrap { position:fixed; left:max(18px,env(safe-area-inset-left)); bottom:max(18px,env(safe-area-inset-bottom)); z-index:70; }
    .theme-button { width:46px; height:46px; border:1px solid var(--line); border-radius:50%; background:rgba(255,255,255,.76); backdrop-filter:blur(13px); box-shadow:0 12px 30px rgba(65,45,53,.14); cursor:pointer; font-size:1.05rem; }
    .theme-menu { position:absolute; left:0; bottom:57px; display:grid; grid-template-columns:repeat(4,34px); gap:10px; padding:12px; border-radius:18px; background:rgba(255,255,255,.86); backdrop-filter:blur(16px); box-shadow:0 16px 40px rgba(70,50,58,.16); border:1px solid var(--line); opacity:0; transform:translateY(8px) scale(.97); pointer-events:none; transition:.2s; }
    .theme-menu.open { opacity:1; transform:none; pointer-events:auto; }
    .swatch { width:34px; height:34px; border-radius:50%; border:2px solid rgba(255,255,255,.9); box-shadow:0 0 0 1px rgba(60,45,50,.08); cursor:pointer; transition:.17s; }
    .swatch:hover,.swatch.active { transform:scale(1.14); }

    @media (max-width:720px) {
      :root { --top:112px; }
      .topbar { padding-left:15px; padding-right:15px; }
      .brand {
        font-size:1.02rem;
        min-width:0;
        overflow:hidden;
        text-overflow:ellipsis;
      }
      .toprow { gap:8px; }
      .top-actions { flex:0 0 auto; }
      .pill {
        padding:8px 10px;
        font-size:.79rem;
        white-space:nowrap;
      }
      .filters { margin-top:9px; }
      .filter { padding:6px 10px; font-size:.72rem; }
      .bookshelf {
        gap:30px; padding-left:18vw; padding-right:18vw; scroll-padding-inline:18vw;
        padding-top:calc(var(--top) + 22px); align-items:center;
      }
      .book { width:min(64vw,250px); }
      .book:hover { transform:none; }
      .book:active { transform:scale(.97) rotateY(-5deg); }
      .modal { align-items:flex-end; padding:0; }
      .detail-card {
        width:100%; max-height:92dvh; border-radius:25px 25px 0 0; grid-template-columns:1fr; gap:22px; text-align:center;
        padding:24px 20px calc(26px + env(safe-area-inset-bottom)); overscroll-behavior:contain;
      }
      .detail-book { width:min(43vw,180px); margin:0 auto; transform:perspective(900px) rotateY(-8deg); }
      .details h1 {
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(2rem,4.8vw,4rem);
      line-height:1.03;
      margin:0 0 20px;
    }
      .actions { justify-content:center; }
      .details p {
      line-height:1.78;
      color:#5c4d53;
      font-size:1rem;
      max-width:58ch;
    }
      .actions { position:sticky; bottom:0; padding-top:12px; padding-bottom:4px; background:linear-gradient(to top,rgba(255,255,255,.95) 70%,transparent); }
      .save-btn,.warning-btn,.read-free-btn { min-height:44px; }
      .saved-panel { align-items:flex-end; padding:0; }
      .saved-shell { width:100%; height:88dvh; border-radius:25px 25px 0 0; padding:20px 16px calc(20px + env(safe-area-inset-bottom)); }
      .saved-books { gap:28px; padding-left:12vw; padding-right:12vw; scroll-padding-inline:12vw; }
      .saved-book { width:min(56vw,215px); }
      .theme-wrap { left:14px; bottom:max(14px,env(safe-area-inset-bottom)); }
      .theme-menu { grid-template-columns:repeat(3,34px); }

  
      }
  </style>
</head>
<body>
  <section class="passcode-gate" id="passcodeGate" aria-label="Passcode required">
    <div class="passcode-card" id="passcodeCard">
      <div class="passcode-kicker">Private shelf</div>
      <h1 class="passcode-title">For my Panther ♡</h1>
      <p class="passcode-subtitle">Enter the four-digit code to open your books.</p>

      <div class="passcode-dots" aria-label="4 digit passcode">
        <span class="passcode-dot"></span>
        <span class="passcode-dot"></span>
        <span class="passcode-dot"></span>
        <span class="passcode-dot"></span>
      </div>

      <div class="keypad" id="keypad">
        <button class="key" data-digit="1">1</button>
        <button class="key" data-digit="2">2</button>
        <button class="key" data-digit="3">3</button>
        <button class="key" data-digit="4">4</button>
        <button class="key" data-digit="5">5</button>
        <button class="key" data-digit="6">6</button>
        <button class="key" data-digit="7">7</button>
        <button class="key" data-digit="8">8</button>
        <button class="key" data-digit="9">9</button>
        <button class="key utility" id="clearCode">Clear</button>
        <button class="key" data-digit="0">0</button>
        <button class="key utility" id="deleteCode">⌫</button>
      </div>

      <div class="passcode-error" id="passcodeError" aria-live="polite"></div>
    </div>
  </section>
  <header class="topbar">
    <div class="toprow">
      <div class="brand">Books for my Panther ♡</div>
      <div class="top-actions">
        <button class="pill saved-tab" id="savedTab">♡ Saved <span id="savedCount">0</span></button>
      </div>
    </div>
    <div class="filters" id="filters">
      <button class="filter active" data-filter="All">All</button>
      <button class="filter" data-filter="Dark Romance">Dark Romance</button>
      <button class="filter" data-filter="Mystery">Mystery</button>
      <button class="filter" data-filter="Vampires">Vampires</button>
      <button class="filter" data-filter="Werewolves">Werewolves</button>
      <button class="filter" data-filter="Stalker">Stalker</button>
      <button class="filter" data-filter="Mafia">Mafia</button>
    </div>
  </header>

  <main class="bookshelf" id="bookshelf"></main>

  <div class="saved-panel" id="savedPanel" aria-hidden="true">
    <section class="saved-shell">
      <div class="saved-header"><h2>Saved Books ♡</h2><button class="close" id="savedClose">×</button></div>
      <div class="saved-books" id="savedBooks"></div>
    </section>
  </div>

  <div class="theme-wrap">
    <button class="theme-button" id="themeButton" aria-label="Change background colour">◐</button>
    <div class="theme-menu" id="themeMenu">
      <button class="swatch" data-theme="pink" style="background:linear-gradient(135deg,#d9a9ba,#c78fa4)" aria-label="Pink"></button>
      <button class="swatch" data-theme="red" style="background:linear-gradient(135deg,#c98f93,#b8757b)" aria-label="Red"></button>
      <button class="swatch" data-theme="blue" style="background:linear-gradient(135deg,#9eb9cf,#7fa1bd)" aria-label="Blue"></button>
      <button class="swatch" data-theme="brown" style="background:linear-gradient(135deg,#b49b89,#927866)" aria-label="Brown"></button>
      <button class="swatch" data-theme="purple" style="background:linear-gradient(135deg,#b6a1cc,#9a82b5)" aria-label="Purple"></button>
      <button class="swatch" data-theme="green" style="background:linear-gradient(135deg,#a7bea9,#89a78d)" aria-label="Green"></button>
      <button class="swatch" data-theme="orange" style="background:linear-gradient(135deg,#d7a783,#c18c67)" aria-label="Orange"></button>
      <button class="swatch" data-theme="yellow" style="background:linear-gradient(135deg,#d8c78e,#c4af6e)" aria-label="Yellow"></button>
      <button class="swatch" data-theme="teal" style="background:linear-gradient(135deg,#91b9b4,#6f9e98)" aria-label="Teal"></button>
      <button class="swatch" data-theme="grey" style="background:linear-gradient(135deg,#b8b4b4,#999494)" aria-label="Grey"></button>
      <button class="swatch" data-theme="cream" style="background:linear-gradient(135deg,#d8cdb7,#c8baa0)" aria-label="Cream"></button>
      <button class="swatch" data-theme="rose" style="background:linear-gradient(135deg,#cf9da0,#ba7f84)" aria-label="Rose"></button>
    </div>
  </div>
</div>

  <div class="modal" id="modal" aria-hidden="true">
    <section class="detail-card">
      <button class="close" id="closeModal">×</button>
      <div class="detail-book"><div class="detail-cover" id="detailCover"></div></div>

  "Dark Romance":["#241820","#7a3a4c"],
  "Mystery & Thriller":["#1d2932","#536877"]

const themes = {
  pink:{bg:"#d9a9ba",bg2:"#c78fa4",accent:"#9f5f78"}, red:{bg:"#c98f93",bg2:"#b8757b",accent:"#944d55"},
  blue:{bg:"#9eb9cf",bg2:"#7fa1bd",accent:"#587c99"}, brown:{bg:"#b49b89",bg2:"#927866",accent:"#735a49"},

const $ = s => document.querySelector(s);
const bookshelf = $("#bookshelf"), modal = $("#modal"), savedPanel = $("#savedPanel"), savedBooks = $("#savedBooks");
let activeBookId = null, currentFilter = "All";

function getSaved() { return JSON.parse(localStorage.getItem("inkittSavedBookIds") || "[]"); }
function setSaved(ids) { localStorage.setItem("inkittSavedBookIds", JSON.stringify(ids)); $("#savedCount").textContent = ids.length; }
function bookById(id) { return books.find(b => b.id === id); }

function generatedCoverHTML(book) {
  const [c1,c2] = coverThemes[book.section] || ["#302531","#7a6578"];
  return `<div class="generated-cover" style="--cover1:${c1};--cover2:${c2}">
    <div class="fallback-cover-inner">
      <span class="fallback-mark">✦</span>
      <div>
        <div class="fallback-title">${book.title}</div>
        <div class="fallback-author">${book.author}</div>
      </div>
    </div>
  </div>`;
}
function coverShell(book, detail=false) {
  return `${generatedCoverHTML(book)}<img
    class="real-cover"
    data-cover-id="${book.id}"
    data-quality="${detail ? "large" : "small"}"
    alt="Cover of ${book.title}"
    loading="${detail ? "eager" : "lazy"}"
    decoding="async"
  >`;
}

function matchesFilter(book, filter) {
  if (filter === "All") return true;
  const haystack = [book.section, ...(book.tags || [])].join(" ").toLowerCase();
  const f = filter.toLowerCase();
  if (f === "vampires") return haystack.includes("vampire");
  if (f === "werewolves") return haystack.includes("werewolf") || haystack.includes("lycan") || haystack.includes("shifter");
  if (f === "mystery") return haystack.includes("mystery") || haystack.includes("thriller") || haystack.includes("suspense");
  if (f === "stalker") return haystack.includes("stalker") || haystack.includes("obsession");
  if (f === "mafia") return haystack.includes("mafia") || haystack.includes("criminal underworld");
  return haystack.includes(f);
}

function renderShelf() {
  const list = books.filter(b => matchesFilter(b,currentFilter));
  bookshelf.innerHTML = list.length ? list.map(book => `
    <article class="book" tabindex="0" role="button" aria-label="Open ${book.title}" data-id="${book.id}">
      <div class="book-cover">${coverShell(book)}</div>
    </article>`).join("") : `<div class="empty-state">No books in this category yet.</div>`;
  bookshelf.scrollLeft = 0;
  observeCovers(bookshelf);

  // Start resolving the first few cover URLs in the background so
  // they're ready by the time she swipes to them.
  prefetchUpcomingCovers(list, 4);
}

const coverLookupPromises = new Map();

async function fetchCoverSet(book) {
  const cacheKey = "inkittCoverV2:" + book.id;

  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey) || "null");
    if (cached && cached.url) return { small: cached.url, large: cached.url };
    if (cached && cached.none) return null;
  } catch (e) {}

  if (coverLookupPromises.has(book.id)) {
    return coverLookupPromises.get(book.id);
  }

  const request = (async () => {
    try {
      // Microlink reads the Inkitt story page's Open Graph metadata and returns
      // the actual social/cover artwork. Its browser endpoint supports CORS.
      const endpoint =
        "https://api.microlink.io/?url=" +
        encodeURIComponent(book.inkittUrl) +
        "&meta=true";

      const response = await fetch(endpoint, { cache: "force-cache" });
      if (!response.ok) throw new Error("Cover metadata unavailable");

      const payload = await response.json();
      const data = payload && payload.data ? payload.data : {};

      let imageUrl =
        (data.image && data.image.url) ||
        (data.screenshot && data.screenshot.url) ||
        null;

      if (imageUrl) {
        imageUrl = imageUrl.replace(/^http:/, "https:");
        localStorage.setItem(cacheKey, JSON.stringify({ url: imageUrl }));
        return { small: imageUrl, large: imageUrl };
      }
    } catch (e) {
      console.warn("Could not load Inkitt cover for", book.title, e);
    }

    localStorage.setItem(cacheKey, JSON.stringify({ none: true }));
    return null;
  })();

  coverLookupPromises.set(book.id, request);

  try {
    return await request;
  } finally {
    coverLookupPromises.delete(book.id);
  }
}

async function hydrateImage(img) {
  if (!img || img.dataset.loaded === "1") return;

  img.dataset.loaded = "1";
  const book = bookById(img.dataset.coverId);
  if (!book) return;

  const covers = await fetchCoverSet(book);
  if (!covers) return;

  const quality = img.dataset.quality === "large" ? "large" : "small";
  const url = covers[quality] || covers.large || covers.small;
  if (!url) return;

  img.onload = () => {
    img.classList.add("loaded");

    const parent = img.parentElement;
    if (parent) {
      const fallback = parent.querySelector(".generated-cover");
      if (fallback) {
        fallback.style.opacity = "0";
        fallback.style.visibility = "hidden";
      }
    }
  };

  img.onerror = () => {
    img.dataset.loaded = "0";
  };

  img.src = url;
}

function prefetchUpcomingCovers(list, limit = 4) {
  // Keep prefetch conservative because the free metadata endpoint has a quota.
  list.slice(0, limit).forEach(book => fetchCoverSet(book));
}
const coverObserver = new IntersectionObserver(entries => entries.forEach(e => { if(e.isIntersecting) { hydrateImage(e.target); coverObserver.unobserve(e.target); } }), {rootMargin:"420px"});
function observeCovers(root=document) { root.querySelectorAll("img.real-cover").forEach(img => coverObserver.observe(img)); }


function inkittReadLink(book) {
  const storyUrl = book.inkittUrl;

  // Android: explicitly target Inkitt's package and fall back to the story webpage.
  if (/Android/i.test(navigator.userAgent)) {
    const parsed = new URL(storyUrl);
    const fallback = encodeURIComponent(storyUrl);
    return `intent://${parsed.host}${parsed.pathname}#Intent;scheme=https;package=com.inkitt.android.hermione;S.browser_fallback_url=${fallback};end`;
  }

  // iPhone/iPad and desktop: use Inkitt's normal HTTPS story link.
  // If Inkitt registers it as a universal link, iOS can hand it to the app.
  return storyUrl;
}

function fillBookDetails(book) {
  activeBookId = book.id;
  $("#detailTitle").textContent = book.title;
  $("#detailDescription").textContent = book.description;

  $("#readFreeButton").textContent = "Read";
  $("#readFreeButton").href = inkittReadLink(book);

  $("#detailCover").innerHTML = coverShell(book, true);
  const detailImg = $("#detailCover img");
  hydrateImage(detailImg);

  $("#warnings").textContent = book.warnings.join(" • ");
  $("#warnings").classList.remove("open");
  $("#warningButton").textContent = "Content warnings";
  updateSaveButton();
}

function showBookModal(book) {
  fillBookDetails(book);
  modal.classList.add("open");
  modal.setAttribute("aria-hidden", "false");
}

function openBook(id) {
  const book = bookById(id);
  if (!book) return;
  showBookModal(book);
}
function closeModal() { modal.classList.remove("open"); modal.setAttribute("aria-hidden","true"); }
function updateSaveButton() {
  const saved = getSaved(), yes = saved.includes(activeBookId);
  $("#saveButton").textContent = yes ? "♥ Saved" : "♡ Save";
  $("#saveButton").classList.toggle("saved",yes);
  $("#savedCount").textContent = saved.length;
}
function toggleSave() {
  let saved = getSaved();
  saved = saved.includes(activeBookId) ? saved.filter(id=>id!==activeBookId) : [...saved,activeBookId];
  setSaved(saved); updateSaveButton(); renderSaved();
}
function renderSaved() {
  const ids = getSaved(); $("#savedCount").textContent = ids.length;
  if(!ids.length) { savedBooks.innerHTML = `<div class="empty-state"><div><strong>No saved books yet.</strong><br>Open any book and tap ♡ Save.</div></div>`; return; }
  savedBooks.innerHTML = ids.map(id => { const b=bookById(id); return b?`<article class="saved-book" data-id="${b.id}"><div class="book-cover">${coverShell(b)}</div></article>`:""; }).join("");
  observeCovers(savedBooks);
}

bookshelf.addEventListener("click",e=>{ const el=e.target.closest(".book"); if(el) openBook(el.dataset.id); });
bookshelf.addEventListener("keydown",e=>{ if((e.key==="Enter"||e.key===" ") && e.target.closest(".book")) { e.preventDefault(); openBook(e.target.closest(".book").dataset.id); } });
bookshelf.addEventListener("wheel",e=>{ if(Math.abs(e.deltaY)>Math.abs(e.deltaX)) { e.preventDefault(); bookshelf.scrollLeft += e.deltaY; } },{passive:false});

$("#filters").addEventListener("click",e=>{ const btn=e.target.closest(".filter"); if(!btn) return; currentFilter=btn.dataset.filter; document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===btn)); renderShelf(); });
$("#closeModal").addEventListener("click",closeModal);
modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(); });
$("#saveButton").addEventListener("click",toggleSave);
$("#warningButton").addEventListener("click",()=>{ const w=$("#warnings"); w.classList.toggle("open"); $("#warningButton").textContent=w.classList.contains("open")?"Hide warnings":"Content warnings"; });

$("#savedTab").addEventListener("click",()=>{ renderSaved(); savedPanel.classList.add("open"); savedPanel.setAttribute("aria-hidden","false"); });
$("#savedClose").addEventListener("click",()=>{ savedPanel.classList.remove("open"); savedPanel.setAttribute("aria-hidden","true"); });
savedPanel.addEventListener("click",e=>{ if(e.target===savedPanel) { savedPanel.classList.remove("open"); savedPanel.setAttribute("aria-hidden","true"); } });
savedBooks.addEventListener("click",e=>{ const el=e.target.closest(".saved-book"); if(!el) return; savedPanel.classList.remove("open"); openBook(el.dataset.id); });

document.addEventListener("keydown",e=>{ if(e.key==="Escape") { closeModal(); savedPanel.classList.remove("open"); } });

function applyTheme(name) {
  const t=themes[name]||themes.pink; const r=document.documentElement;
  r.style.setProperty("--bg",t.bg); r.style.setProperty("--bg2",t.bg2); r.style.setProperty("--accent",t.accent);
  document.querySelector('meta[name="theme-color"]').setAttribute("content",t.bg2);
  localStorage.setItem("bookTheme",name);
  document.querySelectorAll(".swatch").forEach(s=>s.classList.toggle("active",s.dataset.theme===name));
}
$("#themeButton").addEventListener("click",e=>{ e.stopPropagation(); $("#themeMenu").classList.toggle("open"); });
$("#themeMenu").addEventListener("click",e=>{ const s=e.target.closest(".swatch"); if(!s) return; applyTheme(s.dataset.theme); $("#themeMenu").classList.remove("open"); });
document.addEventListener("click",e=>{ if(!e.target.closest(".theme-wrap")) $("#themeMenu").classList.remove("open"); });


const PASSCODE = "2808";
const passcodeGate = $("#passcodeGate");
const passcodeCard = $("#passcodeCard");
const passcodeError = $("#passcodeError");
const dots = [...document.querySelectorAll(".passcode-dot")];
let enteredCode = "";

function updatePasscodeDots() {
  dots.forEach((dot, i) => dot.classList.toggle("filled", i < enteredCode.length));
}

function unlockShelf() {
  sessionStorage.setItem("pantherShelfUnlocked", "yes");
  passcodeGate.classList.add("unlocked");
  enteredCode = "";
  updatePasscodeDots();
}

function rejectPasscode() {
  passcodeError.textContent = "That code isn't right ♡";
  passcodeCard.classList.remove("shake");
  void passcodeCard.offsetWidth;
  passcodeCard.classList.add("shake");
  enteredCode = "";
  updatePasscodeDots();
}

function addDigit(digit) {
  if (enteredCode.length >= 4) return;
  passcodeError.textContent = "";
  enteredCode += digit;
  updatePasscodeDots();

  if (enteredCode.length === 4) {
    if (enteredCode === PASSCODE) {
      setTimeout(unlockShelf, 120);
    } else {
      setTimeout(rejectPasscode, 120);
    }
  }
}

$("#keypad").addEventListener("click", e => {
  const key = e.target.closest("[data-digit]");
  if (key) addDigit(key.dataset.digit);
});

$("#clearCode").addEventListener("click", () => {
  enteredCode = "";
  passcodeError.textContent = "";
  updatePasscodeDots();
});

$("#deleteCode").addEventListener("click", () => {
  enteredCode = enteredCode.slice(0, -1);
  passcodeError.textContent = "";
  updatePasscodeDots();
});

document.addEventListener("keydown", e => {
  if (passcodeGate.classList.contains("unlocked")) return;

  if (/^\d$/.test(e.key)) {
    e.preventDefault();
    addDigit(e.key);
  } else if (e.key === "Backspace") {
    e.preventDefault();
    enteredCode = enteredCode.slice(0, -1);
    updatePasscodeDots();
  } else if (e.key === "Escape") {
    enteredCode = "";
    updatePasscodeDots();
  }
});

if (sessionStorage.getItem("pantherShelfUnlocked") === "yes") {
  passcodeGate.classList.add("unlocked");
}



applyTheme(localStorage.getItem("bookTheme")||"pink");
renderShelf(); renderSaved(); updateSaveButton();
</script>
